# Everything scripts/verify.ps1 checks on a developer's machine, on every push
# and pull request, plus a SentinelForge scan of SentinelForge itself.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs to write to the repository. The one job that reports to
# the Security tab asks for that permission itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    env:
      # A throwaway database that exists for the length of this job. The
      # password is derived from the run, so no credential is written here.
      CI_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinelforge_app
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: sentinelforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinelforge_app -d sentinelforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Configure this run
        run: |
          {
            echo "DATABASE_URL=postgresql+psycopg://sentinelforge_app:${CI_DB_PASSWORD}@localhost:5432/sentinelforge"
            echo "TEST_DATABASE_URL=postgresql+psycopg://sentinelforge_app:${CI_DB_PASSWORD}@localhost:5432/sentinelforge_test"
            echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          } >> "$GITHUB_ENV"

      - name: Create the test database
        run: >-
          PGPASSWORD="${CI_DB_PASSWORD}" psql -h localhost -U sentinelforge_app -d sentinelforge
          -c "CREATE DATABASE sentinelforge_test"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Models match migrations
        run: python -m alembic check

      - name: Tests
        run: python -m pytest

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Type-check and build
        run: npm run build

  vscode-extension:
    name: VS Code extension (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # The extension runs the scanner, so its tests need the scanner.
      - name: Install the scanner
        run: python -m pip install -r backend/requirements.txt

      # No npm install: the extension and its tests have no dependencies.
      - name: Tests
        working-directory: vscode-extension
        env:
          SENTINELFORGE_PYTHON: python
        run: node --test

  security-scan:
    name: SentinelForge scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To show findings in the repository's Security tab.
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install the scanner
        run: python -m pip install -r backend/requirements.txt

      # The scanner reads the checkout and executes nothing in it. It needs no
      # database and no secrets, so this job has none.
      #
      # backend/tests and docs are left out on purpose: the tests are full of
      # deliberately vulnerable code and invented credentials, because that is
      # what the analyser is tested on. The number left out is printed.
      - name: Scan this repository
        working-directory: backend
        run: >-
          python -m app.cli scan ..
          --fail-on high
          --exclude backend/tests
          --exclude docs
          --sarif ../sentinelforge.sarif
          --markdown "$GITHUB_STEP_SUMMARY"

      # Runs even when the gate failed: a failed build is exactly when the
      # findings need to be visible. Uploading needs code scanning to be
      # available for the repository (it is for public ones); if it is not,
      # the scan result above still decides the job.
      - name: Upload findings to code scanning
        if: always() && hashFiles('sentinelforge.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sentinelforge.sarif
          category: sentinelforge

      - name: Keep the SARIF file
        if: always() && hashFiles('sentinelforge.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sentinelforge-sarif
          path: sentinelforge.sarif
          retention-days: 14
