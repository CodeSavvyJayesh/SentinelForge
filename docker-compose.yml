# SentinelForge in three containers: PostgreSQL, the API, and the web interface.
#
#   1. copy docker.env.example to .env and fill in the two values it asks for
#   2. docker compose up --build
#   3. open http://localhost:5173
#
# There is no default password and no default signing key anywhere in this
# file. If .env is missing either one, compose stops and says which.
#
# Every published port is bound to 127.0.0.1: the stack is reachable from this
# machine only. The database is not published at all.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinelforge_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see docker.env.example)}
      POSTGRES_DB: sentinelforge
    volumes:
      - sentinelforge-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelforge_app -d sentinelforge"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      args:
        WITH_KNOWLEDGE: ${WITH_KNOWLEDGE:-false}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # "development" because this stack is plain HTTP on localhost. The API
      # refuses to start as "production" unless the session cookie is Secure,
      # which needs TLS: put a TLS-terminating proxy in front, then set
      # ENVIRONMENT=production and COOKIE_SECURE=true in .env.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ENABLE_API_DOCS: "false"
      DATABASE_URL: postgresql+psycopg://sentinelforge_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see docker.env.example)}@db:5432/sentinelforge
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see docker.env.example)}
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WORKSPACE_ROOT: /data/workspaces
      # Explanations and proposed fixes need Ollama, which runs on the host.
      # Scanning, the dashboard and reports work without it.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sentinelforge-workspaces:/data/workspaces
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"

volumes:
  sentinelforge-db:
  sentinelforge-workspaces:
